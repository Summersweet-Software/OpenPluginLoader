name: Run Python Tests

on:
  push:
    branches: [ "main", "staging"]
  pull_request:
    branches: [ "main", "staging" ]

permissions:
  contents: read

jobs:
  test-3-12:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      with:
        enable-cache: true
        python-version: "3.12"

    - name: run tests
      run: uv run pytest

  test-3-13:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      with:
        enable-cache: true
        python-version: "3.13"

    - name: run tests
      run: uv run pytest

  test-3-14:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      with:
        enable-cache: true
        python-version: "3.14"

    - name: run tests
      run: uv run pytest